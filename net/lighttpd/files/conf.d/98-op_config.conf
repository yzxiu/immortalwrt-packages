# OpenWrt custom: expose /etc/config/op_config over HTTP with basic auth
# ---------------------------------------------------------------------
# Access:  http://USER:PASS@<router-ip>:8088/op_config/
# e.g.     http://admin:mypassword@192.168.1.1:8088/op_config/
# (browser/download tools accept credentials embedded in the URL)
#
# Change the password in the htpasswd file below:
#   /etc/lighttpd/htpasswd   (format: username:password , plaintext)
# Then restart:  /etc/init.d/lighttpd restart
# ---------------------------------------------------------------------

# Run as root so we can read /etc/config/op_config (system dir owned by root).
# Empty value = do not drop privileges (keep root).
server.username = ""
server.groupname = ""

# Serve on its own port, away from LuCI's :80 and smartdns-ui's :6080
server.port = 8088

# Directory listing on by default
server.modules += ( "mod_dirlisting" )
dir-listing.activate = "enable"

# Map URL /op_config/ -> disk dir /etc/config/op_config  (no symlink needed)
server.modules += ( "mod_alias" )
alias.url = ( "/op_config/" => "/etc/config/op_config/" )

# Basic auth: protect /op_config/
server.modules += ( "mod_auth" )
auth.backend = "plain"
auth.backend.plain.userfile = "/etc/lighttpd/htpasswd"
auth.require = ( "/op_config/" => (
    "method"  => "basic",
    "realm"   => "Router Files",
    "require" => "valid-user"
) )
